# Q2: decoder quality calibration only.
__include__:
  - deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs_origin_small_dataset/deim_hgnetv2_l_wood_qcmr_q2

DFINETransformer:
  qcmr_enabled: false
  qcmr_quality_calibration: true
  qcmr_score_quality_alpha: 1.0
  qcmr_score_quality_beta: 0.5
  qcmr_eps: 1.0e-6

PostProcessor:
  qcmr_quality_calibration: true
  qcmr_score_quality_alpha: 1.0
  qcmr_score_quality_beta: 0.5
  qcmr_eps: 1.0e-6

DEIMCriterion:
  qcmr_enabled: false
  qcmr_quality_calibration: true
  qcmr_encoder_quality_loss_weight: 0.0
  qcmr_decoder_quality_loss_weight: 1.0
  qcmr_quality_neg_weight: 0.25
  qcmr_quality_target_gamma: 1.0

# DEIM-S + DINOv3 特征蒸馏（M2）
# 基线配置由 tools/make_dataset_config.py 生成：
#   python tools/make_dataset_config.py --preset neu_det --model s --data-root /data/defect
# 本文件只在其上追加 distiller 段，其余训练协议逐字不变（公平性要害）。

__include__: ["./neu_det_s.yml"]

output_dir: ./deim_outputs/neu_det/deim_s_640_e200_distill_seed0

distiller:
  type: FeatureDistiller
  teacher:
    type: DINOv3Teacher
    source: hf                                     # hf | hub
    model_id: /data/weights/dinov3/dinov3-vitb16-pretrain-lvd1689m
    # source: hub 时改用下面三行（并把 model_id 留空）
    # repo_dir: /opt/dinov3
    # hub_entry: dinov3_vitb16
    # weights: /data/weights/dinov3/dinov3_vitb16_pretrain_lvd1689m.pth
    dtype: float16
    # mean / std 留空 = 自动读 preprocessor_config.json，读不到才回退 ImageNet 常数。
    # 显式写了就以配置为准，不会被静默覆盖。
    # mean: [0.485, 0.456, 0.406]
    # std:  [0.229, 0.224, 0.225]

  layers: [0, 1, 2]              # 默认三层；Run-A 用 -u 'distiller.layers=[1]' 覆盖成只蒸 P4
  student_channels: [256, 256, 256]
  student_strides: [8, 16, 32]   # 与 HybridEncoder.feat_strides 一致，用于判定精确对齐层
  align: interpolate             # M3 改成 freqfusion
  loss_type: cosine              # cosine | mse_norm | smooth_l1
  loss_weight: 1.0               # 在 NEU-DET 上快筛一次定死；之后五个数据集全局冻结，不得逐集重调
  aligner_lr: 0.0004             # 同上，全局冻结；留空则跟随 optimizer 第一个 param group
  start_epoch: 0
  stop_epoch: ~                  # 留空 = 全程蒸馏

# DEIM-L 自定义 Wood 数据集微调配置。
# 与 D-FINE 的 Wood 配置保持同一组可调入口：训练轮数、输入尺寸、batch size 和多尺度开关。

__include__:
  [
    "../dataset/custom_detection.yml",
    "../runtime.yml",
    "../base/dataloader.yml",
    "../base/optimizer.yml",
    "../base/dfine_hgnetv2.yml",
    "../base/deim.yml",
  ]

# ==================== 用户可改配置区 ====================
# 实验输出目录。
output_dir: ./deim_outputs/deim_hgnetv2_l_wood_960_seed0

# Wood 数据集类别数，不包含背景类。
num_classes: 9
remap_mscoco_category: False

# 训练总轮数。注意 DEIM 训练代码读取字段名 epoches，不是 D-FINE 的 epochs。
epoches: 40 #58 #25 #100

# DEIM 增强阶段节点。
stage_start_epoch: &stage_start_epoch 3 #4 #1 #4
stage_middle_epoch: &stage_middle_epoch 20 #29 #10 #40
# 第几个 epoch 后关闭 Mosaic/光照扰动/随机扩图/IoU 裁剪/MixUp/多尺度。
aug_stop_epoch: &aug_stop_epoch 34 #50 #18 #72

# DEIM flatcosine 调度参数。
# flat_epoch 通常取 4 + aug_stop_epoch / 2；aug_stop_epoch=72 时为 40。
flat_epoch: *stage_middle_epoch
# no_aug_epoch = epoches - aug_stop_epoch；100 - 72 = 28。
no_aug_epoch: 6 #8 #7 #28
lr_gamma: 0.5

# 训练和验证输入尺寸。评估尺寸必须和 val Resize 保持一致。
train_resize_size: &train_resize_size [960, 960]
eval_resize_size: &eval_resize_size [960, 960]
eval_spatial_size: *eval_resize_size

# collate 阶段使用的基础尺寸；当前多尺度实现使用单个整数，因此建议使用方形输入。
train_base_size: &train_base_size 960
# Mosaic 内部先把单张图缩放到该尺寸，再拼成 2x2；960 输入常用 480。
mosaic_output_size: &mosaic_output_size 480

# 多尺度训练开关：
#   关闭：base_size_repeat: ~
#   开启：base_size_repeat: 4   # 或其他正整数，表示基础尺寸重复次数
multiscale_repeat: &multiscale_repeat 4

# 全局 batch size；多卡训练时单卡 batch_size = total_batch_size / GPU 数量。
train_total_batch_size: &train_total_batch_size 16
val_total_batch_size: &val_total_batch_size 16

# Wood 数据路径，按实际机器位置修改。/home/zxw4090/hjw/D-FINE/data/WoodDefect/wood_coco_all_only_defect_fiter50_final_best/images/train
train_img_folder: &train_img_folder /home/zxw4090/hjw/D-FINE/data/WoodDefect/small_train/images/train
train_ann_file: &train_ann_file /home/zxw4090/hjw/D-FINE/data/WoodDefect/small_train/annotations/instances_train.json
val_img_folder: &val_img_folder /home/zxw4090/hjw/D-FINE/data/WoodDefect/wood_coco_all_only_defect_fiter50_final_best/images/val
val_ann_file: &val_ann_file /home/zxw4090/hjw/D-FINE/data/WoodDefect/wood_coco_all_only_defect_fiter50_final_best/annotations/instances_val.json
# ========================================================

train_dataloader:
  total_batch_size: *train_total_batch_size
  dataset:
    img_folder: *train_img_folder
    ann_file: *train_ann_file
    transforms:
      ops:
        # DEIM 保留 Mosaic；若要完全对齐 D-FINE 的增强链，可删除本行并把 policy.ops 中的 Mosaic 去掉。
        - {
            type: Mosaic,
            output_size: *mosaic_output_size,
            rotation_range: 10,
            translation_range: [0.1, 0.1],
            scaling_range: [0.5, 1.5],
            probability: 1.0,
            fill_value: 0,
            use_cache: False,
            max_cached_images: 50,
            random_pop: True,
          }
        - { type: RandomPhotometricDistort, p: 0.5 }
        - { type: RandomZoomOut, fill: 0 }
        - { type: RandomIoUCrop, p: 0.8 }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: *train_resize_size }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: ConvertPILImage, dtype: "float32", scale: True }
        - { type: ConvertBoxes, fmt: "cxcywh", normalize: True }
      policy:
        name: stop_epoch
        # [4, 40, 72]：第 4 epoch 后进入强增强阶段，第 40 epoch 后降低强增强，第 72 epoch 后关闭强增强。
        epoch: [*stage_start_epoch, *stage_middle_epoch, *aug_stop_epoch]
        ops:
          [
            "Mosaic",
            "RandomPhotometricDistort",
            "RandomZoomOut",
            "RandomIoUCrop",
          ]
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: *train_base_size
    base_size_repeat: *multiscale_repeat
    mixup_prob: 0.5
    mixup_epochs: [*stage_start_epoch, *stage_middle_epoch]
    stop_epoch: *aug_stop_epoch
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: *val_total_batch_size
  dataset:
    img_folder: *val_img_folder
    ann_file: *val_ann_file
    transforms:
      ops:
        - { type: Resize, size: *eval_resize_size }
        - { type: ConvertPILImage, dtype: "float32", scale: True }

HGNetv2:
  name: "B4"
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?!.*norm|bn).*$"
      lr: 0.0000125
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$"
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# DN-DETR style query denoising (training only).
dn_query: &dn_query
  enabled: true
  dn_number: 50
  label_noise_ratio: 0.5
  box_noise_scale: 0.2
  dn_loss_weight: 1.0

DFINETransformer:
  dn_query: *dn_query

DEIMCriterion:
  dn_query: *dn_query

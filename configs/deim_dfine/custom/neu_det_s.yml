# 本文件由 tools/make_dataset_config.py 自动生成，请勿手改。
# 需要改动请改生成参数后重新生成，否则四个增强锚点很容易改漏。
#
# 数据集 neu_det | 模型 DEIM-S | 类别 6
# 训练集 1260 张 | batch 32 | 40 it/epoch
# epoches 200 → 总 8000 iter | warmup 300 (3.8%)
#
# 训练：
#   torchrun --master_port=7777 --nproc_per_node=2 train.py \
#     -c configs/deim_dfine/custom/neu_det_s.yml \
#     -t /path/to/deim_dfine_hgnetv2_s_coco.pth --use-amp --seed 0

__include__: ["../deim_hgnetv2_s_custom.yml"]

output_dir: ./deim_outputs/neu_det/deim_s_640_e200_seed0
num_classes: 6
remap_mscoco_category: False

# ---- 训练轮数与调度：由 epoches 推导，四处已保持一致 ----
epoches: 200
flat_epoch: 98
no_aug_epoch: 12
lr_gamma: 0.5
warmup_iter: 300

ema:
  warmups: 150

# ---- 数据与增强调度 ----
train_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: ./datasets/NEU-DET/images/train
    ann_file: ./datasets/NEU-DET/annotations/instances_train.json
    transforms:
      policy:
        name: stop_epoch
        epoch: [4, 98, 188]
        ops: ["Mosaic", "RandomPhotometricDistort", "RandomZoomOut", "RandomIoUCrop"]
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    mixup_prob: 0.5
    mixup_epochs: [4, 98]
    stop_epoch: 188
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: ./datasets/NEU-DET/images/val
    ann_file: ./datasets/NEU-DET/annotations/instances_val.json
